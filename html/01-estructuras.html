<!DOCTYPE html><!--informa al navegador que version de html se usó para escribir el documento Doctype es una declaracion no una etiqueta-->
<html lang="en"><!--<html> indica que es un documento html, lang es utilizado para indicar el idioma-->
<head><!--head es la cabecera y no se visualiza en el navegador-->
    <!--los metadatos se escriben dentro de head y se usan para posicionar la busqueda y que sea el primero -->
    <meta charset="UTF-8"><!--tipo de codificacion de los caracteres que se utilizan-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--cambios de dimensiones del documento-->
    <title>Document</title><!--titulo del documento o nombre de pagina-->
    <link rel="stylesheet" type="text/css" href=""><!--enlaza un documenrto externo mayormente para usarlo en css-->
</head>
<body><!--va el cuerpo del documento-->
hola mundo
</body>
</html>
